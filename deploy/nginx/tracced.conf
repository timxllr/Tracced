# Nginx VirtualHost Konfiguration für Tracced mit HTTPS & Reverse Proxy
# Pfad: /etc/nginx/sites-available/tracced.conf

server {
    listen 80;
    server_name tracced.dein-server.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tracced.dein-server.de;

    # SSL Zertifikate (z.B. über Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/tracced.dein-server.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracced.dein-server.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Sicherheits-Header
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Statische Frontend-Dateien direkt über Nginx ausliefern (Gzip-komprimiert)
    root /var/www/tracced/frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Anfragen an das lokale FastAPI-Backend weiterleiten
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für längere Backup-Exporte / Importe
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenAPI Dokumentation
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
