<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracced - Messwert Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0f19">
</head>
<body>
  <!-- Header & Synchronisationsstatus -->
  <header class="app-header">
    <a href="#" class="brand" onclick="location.hash=''; location.reload();">
      <span>Tracced</span>
      <span class="brand-badge">V1</span>
    </a>

    <div id="header-actions" class="header-actions" style="display: none;">
      <div id="sync-indicator" class="sync-indicator synced">
        <span class="sync-dot"></span>
        <span id="sync-text">Synchronisiert</span>
      </div>
      <span id="user-email-display" style="font-size: 0.85rem; color: var(--text-muted);"></span>
      <button id="btn-logout" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">Abmelden</button>
    </div>
  </header>

  <!-- Hauptansicht (SPA) -->
  <main id="app-main" class="main-container">
    <div style="text-align: center; padding: 4rem; color: var(--text-muted);">Initialisiere Tracced...</div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
